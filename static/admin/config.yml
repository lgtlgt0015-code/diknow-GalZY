backend:
  name: github
  repo: lgtlgt0015-code/diknow-GalZY
  branch: main
  base_url: https://galgame-cms-oauth.lgtlgt0015.workers.dev
  auth_endpoint: /auth
  callback_url: /callback

# 全局媒体库（用于新建帖子前的临时上传 / 跨帖共享素材）
media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "posts"
    label: "帖子"
    folder: "content/post"
    create: true
    slug: "{{slug}}"
    # ★ 每个帖子独占一个媒体子文件夹，写入相对路径
    media_folder: "../../static/img/uploads/{{slug}}"
    public_folder: "/img/uploads/{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "英文别名", name: "slug", widget: "string", hint: "英文/拼音文件名，如 summer-pockets，决定 URL 和媒体文件夹名"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm"}
      - {label: "封面图", name: "image", widget: "image", required: false}
      - {label: "标签", name: "tags", widget: "list", allow_add: true}
      - {label: "描述", name: "description", widget: "string", required: false}
      - {label: "正文", name: "body", widget: "markdown"}

  # ★ 网站设置 — file collection，每一项是侧栏一个独立入口
  - name: "settings"
    label: "网站设置"
    editor:
      preview: false
    files:
      - name: "playlist"
        label: "🎵 音乐播放列表"
        file: "data/playlist.json"
        fields:
          - name: "songs"
            label: "歌曲列表"
            widget: "list"
            fields:
              - {label: "歌名", name: "title", widget: "string"}
              - {label: "歌手", name: "artist", widget: "string"}
              - {label: "音频文件", name: "file", widget: "file", hint: "上传 mp3 到 /static/audio/"}
              - {label: "封面图", name: "cover", widget: "image", required: false}
      - name: "bg_images"
        label: "🖼 背景图列表"
        file: "data/bg_images.json"
        fields:
          - name: "images"
            label: "图片列表"
            widget: "list"
            fields:
              - {label: "图片", name: "src", widget: "image"}
