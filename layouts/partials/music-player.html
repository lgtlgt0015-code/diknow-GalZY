{{/* 音乐播放器 — 数据源 data/playlist.json */}}
{{- $songs := hugo.Data.playlist.songs -}}
{{- if $songs -}}
<div id="music-player" aria-label="音乐播放器">
  <button id="music-toggle" aria-label="展开播放器" title="音乐">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
  <div id="music-card">
    <div id="music-info">
      <div id="music-title" class="music-marquee"><span>{{ (index $songs 0).title }}</span></div>
      <div id="music-artist">{{ (index $songs 0).artist }}</div>
      <div id="music-controls">
        <button id="btn-prev" aria-label="上一首" title="上一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button id="btn-play" aria-label="播放" title="播放">
          <svg class="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btn-next" aria-label="下一首" title="下一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>
      <div id="music-progress">
        <div id="music-progress-bar"><div id="music-progress-fill"></div></div>
        <div id="music-time"><span id="time-current">0:00</span><span id="time-duration">0:00</span></div>
      </div>
    </div>
    <div id="music-cover">
      <img src="" alt="" id="music-cover-img" style="display:none" />
      <div id="music-cover-fallback"></div>
    </div>
  </div>
  <audio id="music-audio" preload="none"></audio>
</div>

<script>
(function(){
  // Hugo jsonify 输出 JSON 字符串，用 JSON.parse 转回数组
  var playlist = JSON.parse({{ $songs | jsonify }});
  if (!Array.isArray(playlist) || !playlist.length) return;

  // shuffle 播放顺序 — 每次进站都不同
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }
  var order = playlist.map(function(_, i){ return i; });
  shuffle(order);
  var idx = 0; // 指向 order[]

  var audio = document.getElementById('music-audio');
  var player = document.getElementById('music-player');
  var card   = document.getElementById('music-card');
  var toggleBtn = document.getElementById('music-toggle');
  var titleEl   = document.getElementById('music-title').querySelector('span');
  var artistEl  = document.getElementById('music-artist');
  var coverImg  = document.getElementById('music-cover-img');
  var coverFallback = document.getElementById('music-cover-fallback');
  var playBtn   = document.getElementById('btn-play');
  var iconPlay  = playBtn.querySelector('.icon-play');
  var iconPause = playBtn.querySelector('.icon-pause');
  var progressFill = document.getElementById('music-progress-fill');
  var timeCurrent  = document.getElementById('time-current');
  var timeDuration = document.getElementById('time-duration');

  function load(i) {
    idx = i;
    var s = playlist[order[i]];
    titleEl.textContent = s.title;
    artistEl.textContent = s.artist;
    titleEl.parentElement.classList.remove('music-marquee-overflow');
    titleEl.style.animation = 'none';
    void titleEl.offsetWidth;
    if (titleEl.scrollWidth > titleEl.parentElement.clientWidth) {
      titleEl.parentElement.classList.add('music-marquee-overflow');
      titleEl.style.animation = '';
    }
    if (s.cover && coverImg) {
      coverImg.src = s.cover;
      coverImg.style.display = '';
      if (coverFallback) coverFallback.style.display = 'none';
    } else {
      if (coverImg) coverImg.style.display = 'none';
      if (coverFallback) coverFallback.style.display = 'flex';
    }
    audio.src = s.file;
    audio.load();
  }

  function setPlaying(on) {
    iconPlay.style.display  = on ? 'none' : '';
    iconPause.style.display = on ? '' : 'none';
    player.classList.toggle('is-playing', on);
  }

  function fmtTime(s) {
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // === 展开/收起逻辑 ===
  function showCard() {
    player.classList.add('is-expanded');
    document.body.classList.add('music-expanded');
    toggleBtn.setAttribute('aria-label','收起播放器');
  }
  function hideCard() {
    player.classList.remove('is-expanded');
    document.body.classList.remove('music-expanded');
    toggleBtn.setAttribute('aria-label','展开播放器');
  }

  toggleBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (player.classList.contains('is-expanded')) hideCard();
    else showCard();
  });

  // 点击卡片内部空白区域 → 收起
  card.addEventListener('click', function(e){
    // 点任何地方都收起，除非点的是按钮
    if (!e.target.closest('button')) hideCard();
  });

  // 点击页面其他地方 → 收起
  document.addEventListener('click', function(e){
    if (player.classList.contains('is-expanded') && !player.contains(e.target)) {
      hideCard();
    }
  });

  // === 播放控制 ===
  playBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (audio.paused) { audio.play(); }
    else { audio.pause(); }
  });

  document.getElementById('btn-prev').addEventListener('click', function(e){
    e.stopPropagation();
    idx = (idx - 1 + order.length) % order.length;
    load(idx);
    audio.play();
  });

  document.getElementById('btn-next').addEventListener('click', function(e){
    e.stopPropagation();
    idx = (idx + 1) % order.length;
    load(idx);
    audio.play();
  });

  audio.addEventListener('loadedmetadata', function(){
    timeDuration.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('timeupdate', function(){
    if (!audio.duration) return;
    var pct = audio.currentTime / audio.duration * 100;
    progressFill.style.width = pct + '%';
    timeCurrent.textContent = fmtTime(audio.currentTime);
  });
  audio.addEventListener('ended', function(){
    idx++;
    if (idx >= order.length) { shuffle(order); idx = 0; }
    load(idx);
    audio.play();
  });
  audio.addEventListener('play',  function(){ setPlaying(true); });
  audio.addEventListener('pause', function(){ setPlaying(false); });
  audio.addEventListener('error', function(){
    console.warn('Music player: failed to load', audio.src);
    setPlaying(false);
  });

  document.getElementById('music-progress-bar').addEventListener('click', function(e){
    e.stopPropagation();
    if (!audio.duration) return;
    var rect = this.getBoundingClientRect();
    var pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // 沉浸模式隐藏
  new MutationObserver(function(){
    player.style.display = document.body.classList.contains('immersive-mode') ? 'none' : '';
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  load(0);
})();
</script>
{{- end -}}
